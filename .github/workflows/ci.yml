name: CI
on: [push, pull_request]
permissions:
  contents: read
  id-token: write # Required for OIDC trusted publishing
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        scope: '@variocube'
    - run: npm ci
    - run: npm run build
    - run: npm run test
    - if: startsWith(github.ref, 'refs/tags/')
      run: |
        (cd packages/vcmp && npm publish --provenance --access public)
        (cd packages/vcmp-server && npm publish --provenance --access public)
